<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="phoneShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="-15" dy="30" stdDeviation="30" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ff6b00" flood-opacity="0.2" />
    </filter>

    <!-- Degradados -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#ff6b00" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tabletBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a352a" />
      <stop offset="50%" stop-color="#251610" />
      <stop offset="100%" stop-color="#3d281e" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4136" />
      <stop offset="40%" stop-color="#2b1b14" />
      <stop offset="100%" stop-color="#6d4e3f" />
    </linearGradient>

    <linearGradient id="tabletScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160b06" />
      <stop offset="100%" stop-color="#0d0502" />
    </linearGradient>

    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120804" />
      <stop offset="100%" stop-color="#0a0301" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff8833" />
    </linearGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Resplandor ambiental naranja de fondo -->
  <ellipse cx="430" cy="310" rx="300" ry="240" fill="url(#bgGlow)" filter="url(#glow)" />

  <!-- ==================== TABLETA ==================== -->
  <g filter="url(#softShadow)" transform="translate(40, 40)">
    <!-- Chasis Tableta -->
    <rect x="0" y="0" width="480" height="500" rx="32" fill="#1c100a" stroke="url(#tabletBorder)" stroke-width="3.5" />

    <!-- Notch / Sensor Superior -->
    <rect x="220" y="14" width="40" height="4" rx="2" fill="#36251b" />

    <!-- Pantalla Tableta -->
    <rect x="18" y="28" width="444" height="444" rx="20" fill="url(#tabletScreenGrad)" />

    <!-- Barra de Navegador de la Tableta -->
    <path d="M 18 48 C 18 37, 27 28, 38 28 L 442 28 C 453 28, 462 37, 462 48 L 462 64 L 18 64 Z" fill="#1a0f09" />
    <line x1="18" y1="64" x2="462" y2="64" stroke="#2e1b12" stroke-width="1" />
    
    <!-- Botones de la ventana -->
    <circle cx="38" cy="46" r="4.5" fill="#ff5f57" />
    <circle cx="53" cy="46" r="4.5" fill="#febc2e" />
    <circle cx="68" cy="46" r="4.5" fill="#28c840" />

    <!-- URL simulada -->
    <rect x="115" y="37" width="260" height="18" rx="9" fill="#120804" stroke="#2e1b12" stroke-width="0.8" />
    <text x="245" y="50" fill="#e2bfb0" font-size="9.5" font-family="'Space Grotesk', sans-serif" text-anchor="middle" opacity="0.6">agenciapulse.com</text>

    <!-- Contenido de la Pantalla Tableta -->
    <!-- Tag superior -->
    <text x="240" y="110" fill="#ff6b00" font-size="11" font-family="'Fira Sans', monospace" text-anchor="middle" opacity="0.75">&lt;section class=&quot;section-I&quot;&gt;</text>

    <!-- Mini logo / badge -->
    <rect x="170" y="130" width="140" height="22" rx="11" fill="#2b180f" stroke="#ff6b00" stroke-opacity="0.35" stroke-width="1" />
    <text x="240" y="145" fill="#ffb693" font-size="9.5" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1.5">AGENCIA PULSE</text>

    <!-- Título Impactante -->
    <text x="240" y="195" fill="#f8ddd2" font-size="32" font-family="'Epilogue', sans-serif" font-weight="900" text-anchor="middle">
      Tu marca,
    </text>
    <text x="240" y="235" fill="#ff6b00" font-size="32" font-family="'Epilogue', sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
      otro nivel.
    </text>

    <!-- Subtexto -->
    <text x="240" y="270" fill="#e2bfb0" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" opacity="0.85">
      Diseño de vanguardia y código de alto rendimiento
    </text>

    <!-- Botón CTA -->
    <g transform="translate(160, 295)">
      <rect x="0" y="0" width="160" height="38" rx="10" fill="url(#btnGrad)" />
      <text x="80" y="24" fill="#170b06" font-size="12" font-family="'Space Grotesk', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">EMPEZAR AHORA</text>
    </g>

    <!-- Tag inferior -->
    <text x="240" y="375" fill="#ff6b00" font-size="11" font-family="'Fira Sans', monospace" text-anchor="middle" opacity="0.75">&lt;/section&gt;</text>

    <!-- Mini tarjetas inferiores de servicios -->
    <g transform="translate(45, 395)">
      <rect x="0" y="0" width="115" height="50" rx="8" fill="#23140c" stroke="#382115" stroke-width="1" />
      <text x="57" y="23" fill="#ff6b00" font-size="10" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">Landing Page</text>
      <text x="57" y="38" fill="#a98a7d" font-size="8" font-family="'Inter', sans-serif" text-anchor="middle">Conversión directa</text>

      <rect x="135" y="0" width="115" height="50" rx="8" fill="#ff6b00" fill-opacity="0.15" stroke="#ff6b00" stroke-opacity="0.45" stroke-width="1" />
      <text x="192" y="23" fill="#ffb693" font-size="10" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">Institucional</text>
      <text x="192" y="38" fill="#e2bfb0" font-size="8" font-family="'Inter', sans-serif" text-anchor="middle">Sede oficial</text>

      <rect x="270" y="0" width="115" height="50" rx="8" fill="#23140c" stroke="#382115" stroke-width="1" />
      <text x="327" y="23" fill="#ff6b00" font-size="10" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">E-commerce</text>
      <text x="327" y="38" fill="#a98a7d" font-size="8" font-family="'Inter', sans-serif" text-anchor="middle">Tienda online</text>
    </g>

    <!-- Reflejo de cristal -->
    <polygon points="18,28 320,28 18,330" fill="url(#glassReflect)" pointer-events="none" />
  </g>

  <!-- ==================== CELULAR ==================== -->
  <g filter="url(#phoneShadow)" transform="translate(490, 120)">
    <!-- Chasis Celular -->
    <rect x="0" y="0" width="250" height="460" rx="42" fill="#1c0f08" stroke="url(#phoneBorder)" stroke-width="3.5" />

    <!-- Pantalla Celular -->
    <rect x="10" y="10" width="230" height="440" rx="34" fill="url(#phoneScreenGrad)" />

    <!-- Dynamic Island / Notch -->
    <rect x="87" y="18" width="76" height="18" rx="9" fill="#080201" />
    <circle cx="147" cy="27" r="3.5" fill="#150904" />

    <!-- Barra de Estado Móvil -->
    <text x="44" y="29" fill="#e2bfb0" font-size="9" font-family="'Space Grotesk', sans-serif" font-weight="600" text-anchor="middle">09:41</text>
    <g transform="translate(190, 22)" fill="#e2bfb0" opacity="0.8">
      <rect x="0" y="4" width="2" height="4" rx="0.5" />
      <rect x="3" y="2" width="2" height="6" rx="0.5" />
      <rect x="6" y="0" width="2" height="8" rx="0.5" />
      <rect x="12" y="1" width="13" height="7" rx="1.5" fill="none" stroke="#e2bfb0" stroke-width="1" />
      <rect x="13.5" y="2.5" width="8" height="4" rx="0.5" />
    </g>

    <!-- Header Editor de Código -->
    <rect x="20" y="52" width="210" height="26" rx="6" fill="#1c0e08" stroke="#382116" stroke-width="0.8" />
    <circle cx="32" cy="65" r="3" fill="#ff6b00" opacity="0.8" />
    <text x="42" y="69" fill="#ffb693" font-size="9.5" font-family="'Fira Sans', monospace" font-weight="bold">styles.css</text>
    <text x="215" y="69" fill="#9ccaff" font-size="9" font-family="'Fira Sans', monospace" text-anchor="end">CSS</text>

    <!-- Bloque de Código Realista con Clases del Proyecto -->
    <g font-family="'Fira Sans', monospace" font-size="10.5" transform="translate(24, 98)">
      <!-- Regla 1: .title-main -->
      <text y="15"><tspan fill="#ff6b00" font-weight="bold">.title-main</tspan> <tspan fill="#f8ddd2">{</tspan></text>
      <text y="34"><tspan fill="#9ccaff">  color</tspan><tspan fill="#e2bfb0">: </tspan><tspan fill="#ff6b00">#ff6b00</tspan><tspan fill="#f8ddd2">;</tspan></text>
      <text y="53"><tspan fill="#9ccaff">  font-size</tspan><tspan fill="#e2bfb0">: </tspan><tspan fill="#ffb693">4.2rem</tspan><tspan fill="#f8ddd2">;</tspan></text>
      <text y="72"><tspan fill="#9ccaff">  font-weight</tspan><tspan fill="#e2bfb0">: </tspan><tspan fill="#ffb693">900</tspan><tspan fill="#f8ddd2">;</tspan></text>
      <text y="91"><tspan fill="#f8ddd2">}</tspan></text>

      <!-- Divisor con brillo -->
      <line x1="-4" y1="110" x2="206" y2="110" stroke="#ff6b00" stroke-opacity="0.35" stroke-width="1" />

      <!-- Regla 2: .texto-naranja -->
      <text y="130"><tspan fill="#ff6b00" font-weight="bold">.texto-naranja</tspan> <tspan fill="#f8ddd2">{</tspan></text>
      <text y="149"><tspan fill="#9ccaff">  font-style</tspan><tspan fill="#e2bfb0">: </tspan><tspan fill="#ffb693">italic</tspan><tspan fill="#f8ddd2">;</tspan></text>
      <text y="168"><tspan fill="#9ccaff">  letter-spacing</tspan><tspan fill="#e2bfb0">: </tspan><tspan fill="#ffb693">2px</tspan><tspan fill="#f8ddd2">;</tspan></text>
      <text y="187"><tspan fill="#f8ddd2">}</tspan></text>

      <!-- Divisor 2 -->
      <line x1="-4" y1="204" x2="206" y2="204" stroke="#382116" stroke-width="1" />
    </g>

    <!-- Tarjeta de Marketing en Celular -->
    <g transform="translate(20, 332)">
      <rect x="0" y="0" width="210" height="82" rx="14" fill="#201109" stroke="#ff6b00" stroke-opacity="0.35" stroke-width="1" />
      
      <!-- Icono de pulso -->
      <circle cx="24" cy="24" r="10" fill="#ff6b00" fill-opacity="0.2" />
      <circle cx="24" cy="24" r="4" fill="#ff6b00" />
      
      <text x="42" y="22" fill="#ffb693" font-size="8.5" font-family="'Space Grotesk', sans-serif" font-weight="bold" letter-spacing="1">AGENCIA PULSE</text>
      <text x="42" y="34" fill="#a98a7d" font-size="8" font-family="'Inter', sans-serif">Diseño web a medida</text>
      
      <text x="16" y="62" fill="#f8ddd2" font-size="12.5" font-family="'Epilogue', sans-serif" font-weight="bold">
        Diseño que <tspan fill="#ff6b00" font-style="italic">convierte</tspan>
      </text>
    </g>

    <!-- Indicador Home Móvil -->
    <rect x="85" y="434" width="80" height="4" rx="2" fill="#5a4136" />

    <!-- Reflejo en pantalla del celular -->
    <polygon points="10,10 160,10 10,260" fill="url(#glassReflect)" pointer-events="none" />
  </g>
</svg>
